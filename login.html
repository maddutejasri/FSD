<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f0f0f0; text-align: center;">
    <!-- Image Slider (Increased Height) -->
    <div style="width: 100%; height: 500px; overflow: hidden; position: relative;">  
        <marquee behavior="scroll" direction="left" scrollamount="30" style="display: flex; width: 100%;">
            <img src="Calangute Beach.jfif" alt="Image 1" style="width: 50%; height: 100%; object-fit: cover;">
            <img src="Varanasi Tourism.jfif" alt="Image 2" style="width: 50%; height: 100%; object-fit: cover;">
            
        </marquee>
    </div>

    <!-- Login Form -->
    <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 320px; margin: 40px auto;">
        <h2 style="margin-bottom: 20px; font-size: 24px;">Login to Your Account</h2>
        <form>
            <input type="text" name="username" placeholder="Username" required 
                   style="width: 100%; padding: 10px; margin-bottom: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px;">
            <input type="password" name="password" placeholder="Password" required 
                   style="width: 100%; padding: 10px; margin-bottom: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px;">
            <button type="submit" 
                    style="width: 100%; padding: 10px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Login
             
            </button>
        </form>
    </div>
<a href ="audio.html"> click here </a>
</body>
</html>
