  <!-- Details Form Section -->
  <div style="text-align: center; margin-top: 40px;">
    <h1><span style="color: blue;">DETAILS!</span></h1>

    <div style="width: 50%; margin: 0 auto; background-color: #f2f2f2; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
      <form>
        <label for="phone" style="font-weight: bold;">EMAIL:</label><br>
        <input type="text" id="phone" name="phone" style="padding: 8px; width: 100%; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc;"><br><br>

        <label for="name" style="font-weight: bold;">NAME:</label><br>
        <input type="text" id="name" name="name" style="padding: 8px; width: 100%; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc;"><br><br>

        <label for="surname" style="font-weight: bold;">SURNAME:</label><br>
        <input type="text" id="surname" name="surname" style="padding: 8px; width: 100%; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc;"><br><br>
