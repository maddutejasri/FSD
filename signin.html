<!-- Professional Details Form Section -->
<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #2c3e50, #4ca1af);">
  <div style="text-align: center; width: 30%; background-color: white; padding: 40px; border-radius: 10px; 
              box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);">
    <h1 style="color: #2c3e50; font-family: Arial, sans-serif; font-size: 28px; margin-bottom: 20px;">SIGN IN</h1>
    
    <form>
      <label for="email" style="font-weight: bold; color: #333; text-align: left; display: block; margin-bottom: 5px;">Email:</label>
      <input type="email" id="email" name="email" 
             style="padding: 12px; width: 100%; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc; 
                    background-color: #f9f9f9; font-size: 16px;">

      <label for="name" style="font-weight: bold; color: #333; text-align: left; display: block; margin-bottom: 5px;">Name:</label>
      <input type="text" id="name" name="name" 
             style="padding: 12px; width: 100%; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc; 
                    background-color: #f9f9f9; font-size: 16px;">

      <label for="surname" style="font-weight: bold; color: #333; text-align: left; display: block; margin-bottom: 5px;">Surname:</label>
      <input type="text" id="surname" name="surname" 
             style="padding: 12px; width: 100%; margin-bottom: 20px; border-radius: 6px; border: 1px solid #ccc; 
                    background-color: #f9f9f9; font-size: 16px;">

      <button type="submit" 
              style="padding: 14px 0; background-color: #2980b9; color: white; border: none; border-radius: 6px; 
                     cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; transition: 0.3s;">
        Submit
      </button>
      <a href="movie.html" class="next">

    </form>
  </div>
</div>
