<!-- Details Form Section -->
<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #ff9a9e, #fad0c4);">
  <div style="text-align: center; width: 35%; background-color: white; padding: 30px; border-radius: 12px; 
              box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);">
    <h1 style="color: #ff4081; font-family: Arial, sans-serif; font-size: 28px; margin-bottom: 20px;">💖 DETAILS 💖</h1>
    
    <form>
      <label for="email" style="font-weight: bold; color: #555;">EMAIL:</label><br>
      <input type="text" id="email" name="email" 
             style="padding: 10px; width: 85%; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; background-color: #fff5f7;"><br>

      <label for="name" style="font-weight: bold; color: #555;">NAME:</label><br>
      <input type="text" id="name" name="name" 
             style="padding: 10px; width: 85%; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; background-color: #fff5f7;"><br>

      <label for="surname" style="font-weight: bold; color: #555;">SURNAME:</label><br>
      <input type="text" id="surname" name="surname" 
             style="padding: 10px; width: 85%; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; background-color: #fff5f7;"><br>

      <button type="submit" 
              style="padding: 12px 30px; background-color: #ff4081; color: white; border: none; border-radius: 8px; 
                     cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 15px;"> 
        💌 Submit
      </button>
    </form>
  </div>
</div>
