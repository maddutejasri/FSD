<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; text-align: center;">

    <!-- Header -->
    <header style="background-color: #333; color: white; padding: 20px;">
        <h1>Registration Form</h1>
        <p style="font-size: 18px;">Please fill out the form to register.</p>
    </header>

    <!-- Registration Form Section -->
    <section style="margin: 50px auto; padding: 20px; max-width: 400px; background-color: white; border-radius: 8px;">
        <form action="#" method="post">
            <div style="margin-bottom: 15px;">
                <label for="name" style="font-size: 16px; display: block; text-align: left; margin-bottom: 5px;">First Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your first name" style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="surname" style="font-size: 16px; display: block; text-align: left; margin-bottom: 5px;">Surname</label>
                <input type="text" id="surname" name="surname" placeholder="Enter your surname" style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="email" style="font-size: 16px; display: block; text-align: left; margin-bottom: 5px;">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" style="padding: 10px 20px; font-size: 16px; background-color: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">Register</button>
            </div>
        </form>
    </section>

    <!-- Footer -->
    <footer style="background-color: #333; color: white; padding: 10px 0; position: absolute; bottom: 0; width: 100%;">
        <p>&copy; 2025 Registration Form</p>
    </footer>

</body>
</html>
